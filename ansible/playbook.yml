---
- name: Setup Docker and Docker Compose
  hosts: webservers
  become: yes # Security: Use become for privilege escalation, not running the entire playbook as root
  gather_facts: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      ansible.builtin.apt:
        name: ['apt-transport-https', 'ca-certificates', 'curl', 'gnupg-agent', 'software-properties-common']
        state: present

    - name: Add Docker GPG apt key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: ['docker-ce', 'docker-ce-cli', 'containerd.io']
        state: present

    - name: Install Docker Compose
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-linux-x86_64 # Security: Pin to a specific version
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Add current user to docker group # Security: Add a dedicated user to docker group, not root
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Configure UFW (Uncomplicated Firewall) # Security: Configure firewall to only allow necessary ports
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Configure UFW for HTTP/HTTPS (if applicable)
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp
      when: false # Only enable if you are running a web server directly on the host

    - name: Configure UFW for Flask app port
      community.general.ufw:
        rule: allow
        port: '5000'
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Restart Docker service to apply group changes
      ansible.builtin.systemd:
        name: docker
        state: restarted
      # Security: Only restart if the user was added to the docker group
      when: "'docker' in ansible_facts.groups and ansible_user not in ansible_facts.groups.docker"
